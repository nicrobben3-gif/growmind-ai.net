    .gm-header__brand strong { color: #d0fb79; }
    .gm-header__location { color: #afc1bd; font-size: .9rem; }
    .gm-header__brand:focus-visible {
      outline: 3px solid #d0fb79;
      outline-offset: 5px;
      border-radius: .25rem;
    }
